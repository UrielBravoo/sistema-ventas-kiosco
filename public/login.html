<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema de Gestión</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-card { background: #1e293b; padding: 2.5rem; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid #334155; }
        .brand { text-align: center; margin-bottom: 2rem; }
        .brand h1 { font-size: 1.8rem; color: #38bdf8; font-weight: 700; letter-spacing: 0.5px; }
        .brand p { color: #94a3b8; font-size: 0.9rem; margin-top: 0.2rem; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; margin-bottom: 0.5rem; font-size: 0.85rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
        input { width: 100%; padding: 0.75rem 1rem; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 1rem; transition: all 0.3s; }
        input:focus { outline: none; border-color: #38bdf8; box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); }
        .btn-login { width: 100%; padding: 0.75rem; background: #38bdf8; color: #0f172a; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 0.5rem; }
        .btn-login:hover { background: #0ea5e9; }
        .alert { background: #ef4444; color: #fff; padding: 0.75rem; border-radius: 8px; font-size: 0.9rem; margin-bottom: 1rem; display: none; text-align: center; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand">
            <h1>Control de Ventas</h1>
            <p>Panel de Acceso Comercial</p>
        </div>

        <div id="errorAlert" class="alert"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" required placeholder="Ingresá tu usuario">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-login">Ingresar al Sistema</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorAlert = document.getElementById('errorAlert');

            errorAlert.style.display = 'none';

            try {
                // CORREGIDO: Apuntamos exactamente a /auth/login
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Error al iniciar sesión');
                }

                // CORREGIDO: Guardamos token, rol y usuario para las peticiones de kiosco.html
                if (data.token) localStorage.setItem('token', data.token);
                if (data.usuario && data.usuario.role) localStorage.setItem('userRole', data.usuario.role);
                if (data.usuario && data.usuario.username) localStorage.setItem('username', data.usuario.username);

                // Redirección según el rol
                if (data.usuario && data.usuario.role === 'admin') {
                    window.location.href = '/admin.html'; 
                } else {
                    window.location.href = '/kiosco.html'; 
                }

            } catch (err) {
                errorAlert.textContent = err.message;
                errorAlert.style.display = 'block';
            }
        });
    </script>
</body>
</html>
